<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Walmart Sales Forecaster</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #eef2f3; margin: 0; padding: 40px; color: #333; }
        .wrapper { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #0071dc; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background-color: #0071dc; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:hover { background-color: #0056a8; }
        .result { margin-top: 25px; padding: 15px; background-color: #e1f5fe; border-left: 5px solid #0288d1; border-radius: 4px; text-align: center; font-size: 18px; font-weight: bold; color: #01579b; }
    </style>
</head>
<body>

<div class="wrapper">
    <h2>Walmart Future Sales Forecasting</h2>
    
    <form action="/predict" method="POST">
        
        <div class="form-group">
            <label for="store">Store Number (1 - 45):</label>
            <input type="number" id="store" name="store" min="1" max="45" required placeholder="e.g., 1">
        </div>

        <div class="form-group">
            <label for="holiday_flag">Is it a Holiday Week?</label>
            <select id="holiday_flag" name="holiday_flag">
                <option value="0">No, normal week</option>
                <option value="1">Yes, holiday week</option>
            </select>
        </div>

        <div class="form-group">
            <label for="temperature">Expected Temperature (°F):</label>
            <input type="number" step="0.01" id="temperature" name="temperature" required placeholder="e.g., 42.3">
        </div>

        <div class="form-group">
            <label for="fuel_price">Fuel Price per Gallon ($):</label>
            <input type="number" step="0.001" id="fuel_price" name="fuel_price" required placeholder="e.g., 2.57">
        </div>

        <div class="form-group">
            <label for="cpi">Consumer Price Index (CPI):</label>
            <input type="number" step="0.000001" id="cpi" name="cpi" required placeholder="e.g., 211.09">
        </div>

        <div class="form-group">
            <label for="unemployment">Unemployment Rate (%):</label>
            <input type="number" step="0.001" id="unemployment" name="unemployment" required placeholder="e.g., 8.1">
        </div>

        <div class="form-group">
            <label for="day">Day of Month (1 - 31):</label>
            <input type="number" id="day" name="day" min="1" max="31" required placeholder="e.g., 5">
        </div>

        <div class="form-group">
            <label for="month">Month (1 - 12):</label>
            <input type="number" id="month" name="month" min="1" max="12" required placeholder="e.g., 2">
        </div>

        <div class="form-group">
            <label for="year">Year:</label>
            <input type="number" id="year" name="year" min="2010" required placeholder="e.g., 2026">
        </div>

        <button type="submit">Predict Weekly Sales</button>
    </form>

    {% if prediction %}
        <div class="result">
            {{ prediction }}
        </div>
    {% endif %}
</div>

</body>
</html>
